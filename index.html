<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIA Practice</title>
<style>
:root{--ink:#172b28;--green:#145b4c;--line:#acbdb1;--paper:#f7f8f2;--white:#fff}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:repeating-linear-gradient(0deg,#e9eee5 0 1px,var(--paper) 1px 28px);font:1rem/1.5 Georgia,serif}
header,main,footer{width:min(100% - 2rem,46rem);margin:auto}header{padding:1.75rem 0 1rem;border-bottom:2px solid var(--ink)}main{padding:1.5rem 0;min-height:27rem}footer{border-top:1px solid var(--line);padding:1rem 0}
h1,h2,p{margin:0}h1{font-size:2rem}h2{font-size:1.5rem;line-height:1.25}a{color:var(--green)}small,label,button,select,th{font-family:Verdana,sans-serif;font-size:.875rem}
button,select{min-height:2.75rem;border:1px solid var(--green);border-radius:5px;color:var(--ink);background:var(--white);padding:.5rem .75rem}button{cursor:pointer}button:hover:not(:disabled){background:#e2eee6}button:disabled{cursor:default}button:focus-visible,select:focus-visible,h2:focus-visible{outline:3px solid #aa570e;outline-offset:3px}.primary{background:var(--green);color:white}.primary:hover:not(:disabled){background:#0b453a}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:1rem;margin:1.2rem 0}.settings label{display:grid;gap:.3rem}.actions,.rail{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}.actions{margin-top:1rem}.rail{justify-content:space-between;margin-bottom:1rem}.rule{margin:.65rem 0}.clock{padding:.25rem .55rem;background:#efdbad;text-align:center;min-width:4rem;font-variant-numeric:tabular-nums}
.question{display:grid;align-content:center;gap:1rem;min-height:16rem;padding:clamp(.65rem,3%,1.5rem);background:var(--white);border-block:1px solid var(--line);margin:.7rem 0}.statement{text-align:center;font-size:1.35rem}.grid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.45rem}.choices button{min-height:3.2rem;padding:.3rem;overflow-wrap:anywhere;font-size:1rem}.pair{display:grid;justify-items:center;border:1px solid var(--line);padding:.35rem .1rem;font-size:1.6rem}.glyph{display:block;width:min(100%,4.5rem);height:auto}.correct{background:#dcefe1;border-width:2px}.incorrect{background:#f8e1d7;border:2px solid #a34a2c}.feedback{background:#f4eee0;padding:.75rem}.scroll{overflow:auto;margin-block:1rem}table{width:100%;border-collapse:collapse;background:var(--white);font-variant-numeric:tabular-nums}th,td{text-align:left;padding:.45rem;border-bottom:1px solid var(--line)}
</style>
<header><h1>GIA Practice</h1><small>Unofficial practice simulator</small></header>
<main id="app"></main>
<footer><small>Original practice items. Timings and raw results are for practice, not official Thomas scores. <a href="https://www.thomas.co/sites/default/files/2019-08/GIA-Example-Booklet-2018.pdf">Official example booklet</a></small></footer>
<script>
'use strict';
const app = document.querySelector('#app');
const practiceCount = 8;
const range = size => Array.from({length:size}, (_, index) => index);
const random = size => Math.floor(Math.random() * size);
const pick = values => values[random(values.length)];
function shuffle(values) {
  const copy = [...values];
  for (let index = copy.length - 1; index > 0; index--) {
    const other = random(index + 1);
    [copy[index], copy[other]] = [copy[other], copy[index]];
  }
  return copy;
}
const names = ['Alex','Blair','Casey','Drew','Ellis','Finley','Jules','Kai','Morgan','Reese','Robin','Sam','Taylor','Vivian','Wren','Zoe'];
const traits = [['tall','taller','shorter'],['fast','faster','slower'],['old','older','younger'],['heavy','heavier','lighter'],['warm','warmer','cooler'],['calm','calmer','more nervous'],['loud','louder','quieter'],['strong','stronger','weaker']];
function reasoning() {
  const [first, second] = shuffle(names);
  const [base, higher, lower] = pick(traits);
  const statement = pick([`${first} is ${higher} than ${second}.`, `${second} is ${lower} than ${first}.`, `${second} is not as ${base} as ${first}.`]);
  const asksHigher = random(2) === 0;
  return {statement, prompt:`Who is ${asksHigher ? higher : lower}?`, choices:shuffle([first,second]), answer:asksHigher ? first : second, note:statement};
}
function perceptual() {
  const letters = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
  const answer = random(5);
  const pairs = shuffle(range(4)).map(index => {
    const upper = pick(letters);
    const lower = (index < answer ? upper : pick(letters.filter(letter => letter !== upper))).toLowerCase();
    return random(2) ? [upper,lower] : [lower,upper];
  });
  return {pairs, choices:range(5), answer, note:`${answer} of the four pairs match when case is ignored.`};
}
function numbers() {
  const middle = 4 + random(24);
  const left = 1 + random(Math.min(9,middle - 1));
  const right = pick(range(9).map(index => index + 1).filter(gap => gap !== left));
  const low = middle - left;
  const high = middle + right;
  return {choices:shuffle([low,middle,high]), answer:left > right ? low : high, note:`The middle number is ${middle}. The gaps are ${left} to ${low} and ${right} to ${high}.`};
}
const relatedWords = 'tiny minute|swift rapid|silent quiet|brave bold|honest truthful|tired weary|scarce plentiful|expand contract|arrive depart|generous stingy|ancient modern|smooth rough|assist help|gather collect|conceal hide|repair mend|sturdy robust|precise exact|reject accept|borrow lend|gentle harsh|seldom often|include exclude|opaque transparent|genuine authentic|reluctant unwilling|brief concise|abundant ample|cautious careful|fragile delicate|hazard danger|retreat advance|vanish disappear|ordinary common|loosen tighten|optimistic pessimistic|flexible rigid|persist continue|impartial neutral|verify confirm|obscure unclear|grief sorrow|merge combine|steady stable|reveal disclose|ban prohibit|dispute disagreement|select choose|endure withstand|tedious boring|vivid bright|damp moist|frequent regular|rigorous strict|forecast predict|alert drowsy|fortunate lucky|unusual rare|nimble agile|remote distant|shrill piercing|courteous polite|furious angry'.split('|');
const oddWords = 'cabbage harbour lantern saddle volcano walnut tulip keyboard galaxy violin glacier scissors basket compass kangaroo pepper envelope napkin oyster pumpkin trombone chimney magnet pillow teapot zebra nectar diary apricot fossil orchid bridge'.split(' ');
let deck = [];
function words() {
  if (!deck.length) deck = shuffle(relatedWords);
  const [first,second] = deck.pop().split(' ');
  const answer = pick(oddWords);
  return {choices:shuffle([first,second,answer]), answer, note:`${first} and ${second} are related; ${answer} is the odd word out.`};
}
function spatial() {
  const answer = random(3);
  const pairs = shuffle(range(2)).map(index => {
    const mirror = random(2);
    const angle = random(8) * 45;
    const turn = (angle + (1 + random(7)) * 45) % 360;
    return [{angle,mirror},{angle:turn,mirror:index < answer ? mirror : 1 - mirror}];
  });
  return {pairs, choices:range(3), answer, note:`${answer} of the two pairs match by rotation alone.`};
}
const sections = [
  ['Reasoning','Read the comparison, then reveal a question about it. The comparison disappears when the question appears.',reasoning],
  ['Perceptual Speed','Count how many of the four letter pairs match. Upper- and lower-case versions of the same letter count as a match.',perceptual],
  ['Number Speed & Accuracy','Choose the number furthest from the middle value. First identify the lowest and highest numbers.',numbers],
  ['Word Meaning','Choose the odd word out. The other two words are related, for example as synonyms or opposites.',words],
  ['Spatial Visualisation','Count the pairs that match by rotation alone. A reflected shape does not count as a match.',spatial]
];
const entities = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const clean = value => String(value).replace(/[&<>"']/g, character => entities[character]);
const button = (label, action, primary = false) => `<button class="${primary ? 'primary' : ''}" data-action="${action}">${label}</button>`;
const title = text => `<h2 tabindex="-1">${clean(text)}</h2>`;
let config = {section:'all',mode:'guided',minutes:2};
let session, round, ticker;
const sectionId = () => session.queue[session.index];
const active = () => sections[sectionId()];
function render(markup, focus = 'h2') {
  app.innerHTML = markup;
  app.querySelector(focus)?.focus({preventScroll:true});
}
function home() {
  clearInterval(ticker);
  round = null;
  render(`${title('Set up a practice session')}<form><div class="settings">
    <label>Exercise<select name="section"><option value="all">All five sections</option>${sections.map(([name],index) => `<option value="${index}">${clean(name)}</option>`).join('')}</select></label>
    <label>Mode<select name="mode"><option value="guided">Warm-up + timed</option><option value="warmup">Warm-up only</option><option value="timed">Timed only</option></select></label>
    <label>Time per timed section<select name="minutes">${[2,3,5].map(minutes => `<option value="${minutes}">${minutes} minutes</option>`).join('')}</select></label>
    </div><button class="primary" type="submit">Start session</button></form>`);
  const form = app.querySelector('form');
  Object.entries(config).forEach(([key,value]) => { form.elements[key].value = value; });
  const sync = () => { form.elements.minutes.disabled = form.elements.mode.value === 'warmup'; };
  form.elements.mode.addEventListener('change',sync);
  sync();
  form.addEventListener('submit', event => {
    event.preventDefault();
    config = {section:form.elements.section.value,mode:form.elements.mode.value,minutes:Number(form.elements.minutes.value)};
    session = {queue:config.section === 'all' ? range(sections.length) : [Number(config.section)],index:0,results:[]};
    intro(config.mode !== 'timed');
  });
}
function intro(warmup) {
  const [name,rule] = active();
  render(`<div class="rail">${title(name)}<small>Section ${session.index + 1} of ${session.queue.length}</small></div><p class="rule">${clean(rule)}</p><p>${warmup ? 'Eight untimed questions, with feedback after each answer.' : `${config.minutes} minutes. Answers advance immediately; results appear at the end.`}</p><div class="actions">${warmup ? button('Start warm-up','warmup',true) : button('Start timed round','timed',true)}${button('Start over','home')}</div>`);
}
function start(warmup) {
  deck = [];
  round = {warmup, correct:0, answered:0, deadline:warmup ? Infinity : performance.now() + config.minutes * 60000};
  if (!warmup) ticker = setInterval(updateClock,100);
  next();
}
function updateClock() {
  if (!round || round.warmup) return;
  const remaining = round.deadline - performance.now();
  if (remaining <= 0) { finish(); return; }
  const seconds = Math.ceil(remaining / 1000);
  app.querySelector('#clock').textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2,'0')}`;
}
function next() {
  round.item = active()[2]();
  round.phase = sectionId() === 0 ? 'statement' : 'answer';
  showItem();
}
function glyph({angle,mirror}) {
  return `<svg class="glyph" viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(32 32) rotate(${angle}) scale(${mirror ? -1 : 1} 1)"><path fill="#173e37" d="M-15 -19H12V-9H-5V1H7V9H-5V21H-15Z"/><circle cx="15" cy="12" r="4" fill="#ac5329"/></g></svg>`;
}
function showItem(selected) {
  const {item,phase,warmup,answered} = round;
  const reviewing = phase === 'feedback';
  const count = answered + (reviewing ? 0 : 1);
  const status = warmup ? `Warm-up: ${count} / ${practiceCount}` : `Timed: item ${count}`;
  const clock = warmup ? '' : '<small id="clock" class="clock" aria-label="Time remaining"></small>';
  const pairs = item.pairs ? `<div class="grid">${item.pairs.map(pair => `<div class="pair">${pair.map(value => sectionId() === 1 ? `<span>${clean(value)}</span>` : glyph(value)).join('')}</div>`).join('')}</div>` : '';
  const answers = item.choices.map((choice,index) => {
    const style = reviewing ? choice === item.answer ? 'correct' : choice === selected ? 'incorrect' : '' : '';
    return `<button class="${style}" data-choice="${index}" ${reviewing ? 'disabled' : ''}>${clean(choice)}</button>`;
  }).join('');
  const content = phase === 'statement' ? `<p class="statement">${clean(item.statement)}</p>${button('Reveal question','reveal',true)}` : `${item.prompt ? `<p class="statement">${clean(item.prompt)}</p>` : ''}${pairs}<div class="grid choices">${answers}</div>`;
  const feedback = reviewing ? `<p class="feedback" role="status"><strong>${selected === item.answer ? 'Correct.' : `Answer: ${clean(item.answer)}.`}</strong> ${clean(item.note)}</p><div class="actions">${button(count === practiceCount ? 'View warm-up result' : 'Next question','continue',true)}</div>` : '';
  render(`<div class="rail">${title(active()[0])}<small>${status}</small>${clock}</div><div class="question">${content}</div>${feedback}`, reviewing ? '[data-action="continue"]' : phase === 'statement' ? '[data-action="reveal"]' : '[data-choice]');
  updateClock();
}
function table(rows) {
  return `<div class="scroll"><table><thead><tr>${['Exercise','Mode','Answered','Correct','Accuracy'].map(label => `<th scope="col">${label}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr><th scope="row">${clean(row.name)}</th><td>${row.warmup ? 'Warm-up' : 'Timed'}</td><td>${row.answered}</td><td>${row.correct}</td><td>${row.answered ? Math.round(row.correct * 100 / row.answered) + '%' : 'n/a'}</td></tr>`).join('')}</tbody></table></div>`;
}
function finish() {
  clearInterval(ticker);
  const {warmup,answered,correct} = round;
  const result = {name:active()[0],warmup,answered,correct};
  session.results.push(result);
  round = null;
  const guided = warmup && config.mode === 'guided';
  const last = session.index + 1 === session.queue.length;
  render(`${title(warmup ? 'Warm-up results' : 'Timed round results')}${table([result])}<div class="actions">${guided ? button('Continue to timed round','timed-intro',true) : button(last ? 'View session results' : 'Next section','advance',true)}${button('Start over','home')}</div>`);
}
app.addEventListener('click', event => {
  const control = event.target.closest('button');
  if (!control) return;
  if (round && !round.warmup && performance.now() >= round.deadline) { finish(); return; }
  if (control.dataset.choice !== undefined && round?.phase === 'answer') {
    const selected = round.item.choices[Number(control.dataset.choice)];
    round.answered++;
    if (selected === round.item.answer) round.correct++;
    if (round.warmup) { round.phase = 'feedback'; showItem(selected); } else next();
    return;
  }
  switch (control.dataset.action) {
    case 'home': home(); break;
    case 'warmup': start(true); break;
    case 'timed': start(false); break;
    case 'timed-intro': intro(false); break;
    case 'reveal': round.phase = 'answer'; showItem(); break;
    case 'continue': if (round.answered === practiceCount) finish(); else next(); break;
    case 'advance':
      session.index++;
      if (session.index < session.queue.length) intro(config.mode !== 'timed');
      else render(`${title('Session results')}${table(session.results)}<p>Accuracy is correct answers divided by answered items. The unfinished item at the time limit is not counted.</p><div class="actions">${button('New session','home',true)}</div>`);
      break;
  }
});
home();
</script>
</html>
